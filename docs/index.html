<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#667eea">
  <meta name="description" content="ChatBot AI - Trợ lý thông minh trên GitHub Pages">
  
  <title>ChatBot AI Pro 🤖</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-wrapper">
    <!-- Header/Navbar -->
    <nav class="navbar">
      <div class="navbar-content">
        <div class="navbar-left">
          <h1 class="app-title">🤖 ChatBot AI Pro</h1>
        </div>
        <div class="navbar-center">
          <select id="languageSelect" class="lang-selector">
            <option value="vi">🇻🇳 Tiếng Việt</option>
            <option value="en">🇺🇸 English</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="ja">🇯🇵 日本語</option>
          </select>
        </div>
        <div class="navbar-right">
          <button id="voiceToggleBtn" class="btn-icon" title="Bật/Tắt giọng nói">🔊</button>
          <button id="themeToggleBtn" class="btn-icon" title="Dark/Light mode">🌙</button>
          <button id="menuBtn" class="btn-icon" title="Menu">☰</button>
        </div>
      </div>
    </nav>

    <!-- Sidebar Menu -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Menu</h2>
        <button id="closeSidebarBtn" class="btn-close">✕</button>
      </div>
      <div class="sidebar-content">
        <button class="sidebar-btn" onclick="newChatRoom()">
          <span>➕</span> Cuộc trò chuyện mới
        </button>
        <button class="sidebar-btn" onclick="showUserProfile()">
          <span>👤</span> Hồ sơ
        </button>
        <button class="sidebar-btn" onclick="showChatHistory()">
          <span>📋</span> Lịch sử chat
        </button>
        <button class="sidebar-btn" onclick="exportChat()">
          <span>📥</span> Tải xuống chat
        </button>
        <button class="sidebar-btn" onclick="showAdminPanel()">
          <span>⚙️</span> Admin Panel
        </button>
        <button class="sidebar-btn" onclick="toggleWeatherWidget()">
          <span>🌦️</span> Thời tiết
        </button>
        <button class="sidebar-btn" onclick="toggleCryptoWidget()">
          <span>💰</span> Giá Crypto
        </button>
        <button class="sidebar-btn" onclick="playQuiz()">
          <span>🎮</span> Quiz trò chơi
        </button>
        <button class="sidebar-btn" onclick="showSettings()">
          <span>🔧</span> Cài đặt
        </button>
        <button class="sidebar-btn" onclick="clearAllData()">
          <span>🗑️</span> Xoá tất cả dữ liệu
        </button>
      </div>
    </div>

    <div class="main-container">
      <!-- Main Chat Area -->
      <div class="chat-container">
        <!-- Chat Header -->
        <div class="chat-header">
          <div class="bot-info">
            <div class="bot-avatar">🤖</div>
            <div>
              <h1 id="chatTitle">ChatBot AI</h1>
              <span class="status" id="botStatus">Online</span>
            </div>
          </div>
          <div class="chat-stats">
            <span>💬 <span id="messageCount">0</span></span>
          </div>
        </div>

        <!-- Messages Area -->
        <div class="chat-box" id="chatBox"></div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator" style="display: none;">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
          <button id="voiceInputBtn" class="btn-voice" title="Nói thay vì gõ">🎤</button>
          <input 
            type="text" 
            id="messageInput" 
            placeholder="Nhập tin nhắn..."
            autocomplete="off"
          />
          <button id="emojiBtn" class="btn-emoji" title="Emoji">😊</button>
          <button id="sendBtn" class="btn-send" title="Gửi">📤</button>
        </div>

        <!-- Suggestions -->
        <div class="suggestions-area" id="suggestionsArea"></div>
      </div>

      <!-- Sidebar Widgets -->
      <div class="sidebar-widgets">
        <!-- Weather Widget -->
        <div class="widget" id="weatherWidget" style="display: none;">
          <div class="widget-header">🌦️ Thời tiết</div>
          <div class="widget-content" id="weatherContent">
            Đang tải...
          </div>
        </div>

        <!-- Crypto Widget -->
        <div class="widget" id="cryptoWidget" style="display: none;">
          <div class="widget-header">💰 Giá Crypto</div>
          <div class="widget-content" id="cryptoContent">
            Đang tải...
          </div>
        </div>

        <!-- Info Panel -->
        <div class="widget info-panel">
          <div class="widget-header">💡 Gợi ý</div>
          <ul id="suggestionsPanel">
            <li>Xin chào</li>
            <li>Tên bạn là gì</li>
            <li>Bạn có thể giúp gì</li>
            <li>Tạm biệt</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <!-- User Profile Modal -->
  <div class="modal" id="userProfileModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>👤 Hồ sơ người dùng</h2>
        <button class="btn-close" onclick="closeModal('userProfileModal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Tên:</label>
          <input type="text" id="userName" placeholder="Nhập tên của bạn">
        </div>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" id="userEmail" placeholder="Nhập email">
        </div>
        <div class="form-group">
          <label>Avatar URL:</label>
          <input type="text" id="userAvatar" placeholder="https://...">
        </div>
        <button class="btn-primary" onclick="saveUserProfile()">💾 Lưu hồ sơ</button>
      </div>
    </div>
  </div>

  <!-- Admin Panel Modal -->
  <div class="modal" id="adminPanelModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚙️ Admin Panel</h2>
        <button class="btn-close" onclick="closeModal('adminPanelModal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Keyword:</label>
          <input type="text" id="adminKeyword" placeholder="Nhập keyword">
        </div>
        <div class="form-group">
          <label>Response:</label>
          <textarea id="adminResponse" placeholder="Nhập câu trả lời"></textarea>
        </div>
        <button class="btn-primary" onclick="addCustomResponse()">➕ Thêm response</button>
        <hr>
        <div id="customResponsesList"></div>
      </div>
    </div>
  </div>

  <!-- Chat History Modal -->
  <div class="modal" id="chatHistoryModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📋 Lịch sử chat</h2>
        <button class="btn-close" onclick="closeModal('chatHistoryModal')">✕</button>
      </div>
      <div class="modal-body" id="chatHistoryContent">
        Đang tải...
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🔧 Cài đặt</h2>
        <button class="btn-close" onclick="closeModal('settingsModal')">✕</button>
      </div>
      <div class="modal-body">
        <label class="checkbox-label">
          <input type="checkbox" id="autoSaveChat" checked> Tự động lưu chat
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="autoTranslate"> Dịch tự động
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="soundNotifications"> Thông báo âm thanh
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="compactMode"> Chế độ compact
        </label>
        <hr>
        <button class="btn-primary" onclick="saveSettings()">💾 Lưu cài đặt</button>
      </div>
    </div>
  </div>

  <!-- Emoji Picker -->
  <div class="emoji-picker" id="emojiPicker" style="display: none;">
    <div class="emoji-grid" id="emojiGrid"></div>
  </div>

  <!-- Notification -->
  <div class="notification" id="notification"></div>

  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="translations.js"></script>
  <script src="chatbot.js"></script>
  <script src="ui.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
